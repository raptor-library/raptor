name: ci

env:
    CTEST_NO_TEST_ACTION: error
    HOMEBREW_NO_INSTALL_CLEANUP: 1
    # let openmpi oversubscribe ranks
    # OpenMPI 5
    PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
    # OpenMPI 4
    OMPI_MCA_rmaps_base_oversubscribe: "1"

on:
  push:

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check spelling
        uses: crate-ci/typos@v1.52.2

  core:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
          # Debug build: asserts enabled, and used for code coverage
          - os: ubuntu-latest
            build_type: Debug
          - os: macos-latest
            build_type: Release
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Use OpenMPI (MPICH 4.2 has a memory bug)
          # https://github.com/actions/runner-images/issues/13204
          # https://github.com/open-mpi/ompi/issues/8442
          sudo apt-get install cmake libopenmpi-dev openmpi-bin liblapack-dev
      - name: Install MacOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          # brew update # fails
          brew install mpich lapack cmake
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure code
        if: matrix.os == 'ubuntu-latest'
        # set build and launch to openmpi
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ matrix.build_type == 'Debug' && '-DENABLE_COVERAGE=ON' || '' }}
          -DMPI_C_COMPILER=/usr/bin/mpicc.openmpi
          -DMPI_CXX_COMPILER=/usr/bin/mpicxx.openmpi
          -DMPIEXEC_EXECUTABLE=/usr/bin/mpiexec.openmpi
      - name: Configure code
        if: matrix.os == 'macos-latest'
        run: cmake -Bbuild -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build code
        run: cmake --build build --parallel
      - name: Test code
        run: ctest --test-dir build -V
      - name: Code coverage
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
