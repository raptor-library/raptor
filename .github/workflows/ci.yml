name: ci

env:
    CTEST_NO_TEST_ACTION: error
    HOMEBREW_NO_INSTALL_CLEANUP: 1

on:
  push:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install cmake mpich libmpich-dev liblapack-dev
          # Force the mpich launcher and compiler to avoid PMI issues
          sudo update-alternatives --set mpi /usr/bin/mpicc.mpich
          sudo update-alternatives --set mpirun /usr/bin/mpirun.mpich
      - name: Install MacOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          # brew update # fails
          brew install mpich lapack cmake
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure code
        if: matrix.os == 'ubuntu-latest'
        run: cmake -Bbuild -DENABLE_COVERAGE=1
      - name: Configure code
        if: matrix.os == 'macos-latest'
        run: cmake -Bbuild
      - name: Build code
        run: cmake --build build --parallel
      - name: Test code
        run: ctest --test-dir build -V --build-config Debug
      - name: Inspect written mtx (debug)
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          F="$GITHUB_WORKSPACE/test_data/sas_P0_out.mtx"
          echo "f_out path: $F"
          if [ -f "$F" ]; then
            echo "line count: $(wc -l < "$F")"
            echo "distinct value exponents in file:"
            grep -oE 'e[-+][0-9]+' "$F" | sort | uniq -c
            echo "out-of-range magnitude lines (positive exponent => |v|>=1):"
            grep -nE 'e\+0*[1-9]' "$F" | head -20 || echo "  none found"
          else
            echo "f_out not present"
          fi
      - name: collect code coverage
        run: bash <(curl -s https://codecov.io/bash) || echo "codecov failure"
